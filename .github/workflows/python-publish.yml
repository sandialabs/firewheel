# This workflow will upload a Python package in the official FIREWHEEL ecosystem

name: Publish Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  call-firewheel-publishing:
    name: Publish FIREWHEEL Packages
    permissions:
      contents: read
    # zizmor: ignore[unpinned-uses] sandialabs/firewheel_ci is org-controlled; v1 is the intentionally maintained stable interface for FIREWHEEL consumers.
    uses: sandialabs/firewheel_ci/.github/workflows/python-publish.yml@v1
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
