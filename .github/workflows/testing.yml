# This workflow will install Python dependencies and run tests with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Testing

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  LOG_DIR: /var/log/firewheel
  MINIMEGA_CONFIG: /etc/minimega/minimega.conf
  # Set the FIREWHEEL environment variables
  EXPERIMENT_INTERFACE: lo
  MM_BASE: /tmp/minimega
  MM_INSTALL_DIR: /opt/minimega
  GRPC_HOSTNAME: localhost

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0  # full history
        fetch-tags: true
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tar net-tools procps uml-utilities \
                                openvswitch-switch qemu-system-x86 qemu-utils dnsmasq \
                                ntfs-3g iproute2 libpcap-dev
    - name: Prepare minimega
      # zizmor: ignore[unpinned-uses] sandialabs/firewheel_ci is org-controlled; v1 is the intentionally maintained stable interface for FIREWHEEL consumers.
      uses: sandialabs/firewheel_ci/.github/actions/prepare-minimega@v1
    - name: Prepare discovery
      # zizmor: ignore[unpinned-uses] sandialabs/firewheel_ci is org-controlled; v1 is the intentionally maintained stable interface for FIREWHEEL consumers.
      uses: sandialabs/firewheel_ci/.github/actions/prepare-discovery@v1
    - name: Prepare FIREWHEEL
      # zizmor: ignore[unpinned-uses] sandialabs/firewheel_ci is org-controlled; v1 is the intentionally maintained stable interface for FIREWHEEL consumers.
      uses: sandialabs/firewheel_ci/.github/actions/prepare-firewheel@v1
      with:
        install-mode: "source"
    - name: Run unit tests
      run: |
        firewheel test unit -m 'not long and not mcs' \
                            --cov --cov-report=term --cov-fail-under=60
